# Render Production Deployment Blueprint
# Private, single-owner studio. A persistent disk keeps SQLite runs and artifacts
# across restarts and deploys, which restricts the service to one instance.
services:
  - type: web
    name: jobhunt-ai-studio
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    numInstances: 1
    autoDeploy: true
    healthCheckPath: /_stcore/health
    disk:
      name: jobhunt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8501
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      # Server-owned secrets. Set these in the Render dashboard, never in git.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: STUDIO_ACCESS_KEY
        sync: false
